[project]
name = "chronicle-changelog"
version = "0.1.0"
description = "Chronicle - hear why your code exists. Cited, narrated changelogs from git history."
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "maebahesioru" }]
readme = "README.md"

[project.scripts]
chronicle = "chronicle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
